<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <h1 class="padding">Ingrese sus datos</h1>

  <mat-card appearance="outlined">
    <mat-card-header>
      Hola...
    </mat-card-header>
    <mat-card-content>
      <p>
        Mundo!
      </p>
    </mat-card-content>
  </mat-card>

  <ion-list [inset]="true">
    <ion-item>
      <ion-input 
        label="Usuario" 
        labelPlacement="stacked" 
        placeholder="Ingrese nombre"
        [(ngModel)]="nombreUsuario"
      >
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input type="password" label="Contraseña" [(ngModel)]="password">
        <ion-input-password-toggle slot="end"></ion-input-password-toggle>
      </ion-input>
    </ion-item>
  </ion-list>

  <div class="centrar">
    <button matButton="tonal" (click)="ingresar()">Ingresar</button>
  </div>  

</ion-content>
