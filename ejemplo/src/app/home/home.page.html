<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Página principal
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Página principal</ion-title>
    </ion-toolbar>
  </ion-header>

  <div id="container">
    Bienvenido/a {{data.usuario}}!!
    <br/><br/>

    <p>Títulos de poemas aleatorios:</p>
    <br/><br/>

    <ion-list>
      <ion-item *ngFor="let poema of poemas">
        {{poema}}
      </ion-item>
    </ion-list>
    <br/><br/>

    <p>Tomar foto</p>
    <img id="resultadoFoto"/>
    <ion-button
        slot="end"
        (click)="tomarFoto()"
      >
        Tomar foto
      </ion-button>
  </div>
</ion-content>
